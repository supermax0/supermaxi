{% if invoice_capture %}
<style id="invoiceCaptureStyles">
  html, body {
    background: #fff !important;

  }

  .no-print,
  .actions,
  .invoice-actions,
  .risk-banner,
  .risk,
  .risk-info {
    display: none !important;
  }

  .invoice-container {

    border-radius: 0 !important;
    margin: 0 !important;

    padding: 0 !important;
  }

    padding: 20px !important;
  }

  thead,
  .invoice-label,
  .product-img-placeholder,
  .accent-bar {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
