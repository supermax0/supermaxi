<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f9fc">
  <title>دخول مكتب الموظف</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    :root { --wine:#760019; --ink:#17191f; --muted:#858995; --line:#e9ebef; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: #f8f9fc; }
    body {
      font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
      color: var(--ink);
      display: flex; justify-content: center;
    }
    .wrap {
      width: min(430px, 100%);
      min-height: 100dvh;
      padding: max(28px, env(safe-area-inset-top)) 18px 28px;
      display: flex; flex-direction: column; align-items: center;
    }
    .mark {
      width: 64px; height: 64px; border-radius: 20px; margin-top: 12px;
      background: #fff; color: var(--wine);
      display: grid; place-items: center;
      box-shadow: 0 10px 30px -16px rgba(118, 0, 25, .45);
      font-size: 26px; font-weight: 700;
    }
    .pill {
      margin: 16px 0 8px; padding: 4px 10px; border-radius: 999px;
      background: #f7e9ee; color: var(--wine); font-size: 12px; font-weight: 600;
    }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.4px; }
    .lead { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.7; text-align: center; }
    form {
      width: 100%; background: rgba(255,255,255,.92);
      border: 1px solid rgba(233,235,239,.9); border-radius: 24px;
      padding: 16px; box-shadow: 0 16px 40px -24px rgba(23,25,31,.35);
    }
    label { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; font-size: 12px; color: var(--muted); font-weight: 600; }
    input {
      min-height: 48px; border: 1px solid var(--line); border-radius: 16px;
      padding: 0 14px; font: inherit; font-size: 16px; color: var(--ink); background: #f8f9fc;
    }
    input:focus { outline: none; border-color: var(--wine); box-shadow: 0 0 0 3px rgba(118,0,25,.12); }
    button {
      width: 100%; margin-top: 6px; min-height: 52px; border: 0; border-radius: 16px;
      background: var(--wine); color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .55; }
    .err { min-height: 22px; margin: 10px 0 0; color: #ba1a1a; font-size: 13px; font-weight: 600; }
    .hint { margin-top: auto; padding-top: 22px; color: #9aa0ab; font-size: 12px; line-height: 1.6; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">ف</div>
    <div class="pill">بوابة الموظف</div>
    <h1>مرحباً بك مجدداً</h1>
    <p class="lead">سجّل الدخول لحساب الموظف للبدء في إدارة رسائل العملاء والطلبات.</p>
    <form id="ed-login">
      <label>معرف الشركة
        <input name="tenant_slug" value="{{ tenant_slug or '' }}" {% if tenant_slug %}readonly{% endif %} autocomplete="organization" required>
      </label>
      <label>اسم المستخدم
        <input name="username" autocomplete="username" required>
      </label>
      <label>كلمة المرور
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">تسجيل الدخول</button>
      <p class="err" id="ed-login-err">{{ error or "" }}</p>
    </form>
    <p class="hint">نفس حساب النظام. إذا ما عندك صلاحية المكتب، تواصل مع الإدارة.</p>
  </div>
  <script>
    document.getElementById("ed-login").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const err = document.getElementById("ed-login-err");
      const btn = form.querySelector("button");
      err.textContent = "";
      btn.disabled = true;
      const body = Object.fromEntries(new FormData(form).entries());
      try {
        const response = await fetch(location.pathname, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) {
          err.textContent = data.error || "بيانات الدخول غلط.";
          btn.disabled = false;
          return;
        }
        location.href = data.redirect || "/employee-desk";
      } catch (exc) {
        err.textContent = "ماكو نت. أعد المحاولة.";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
