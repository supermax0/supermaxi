<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Finora{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="{% block meta_description %}Finora — تسجيل الدخول لإدارة المبيعات والمخزون والحسابات{% endblock %}">
  <meta name="theme-color" content="#f7f9fc">
  <meta name="robots" content="{% block robots %}noindex,follow{% endblock %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="apple-touch-icon" href="{{ platform_logo_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">

  {# Non-blocking Font Awesome — avoids long render-blocking on auth pages #}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></noscript>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/payment-flow.css') }}">
  <style>
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f9fc;
      color: #101828;
      line-height: 1.6;
    }
    * { box-sizing: border-box; }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
