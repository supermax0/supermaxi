<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طباعة الفواتير المحددة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; background: #eef2f7; }
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: #fff;
      padding: 12px 20px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .toolbar button {
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
    }
    .btn-print { background: #2563eb; color: #fff; }
    .btn-close { background: #f3f4f6; color: #374151; }
    .load-status { color: #6b7280; font-size: 13px; margin-right: auto; }
    .frames-wrap { padding: 72px 16px 32px; }
    .invoice-frame-wrap {
      max-width: 900px;
      margin: 0 auto 28px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
      page-break-after: always;
      break-after: page;
    }
    .invoice-frame-wrap:last-child {
      page-break-after: auto;
      break-after: auto;
    }
    .invoice-frame {
      width: 100%;
      border: 0;
      display: block;
      min-height: 480px;
      background: #fff;
    }
    @media print {
      html, body {
        background: #fff !important;
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
      .toolbar, .no-print { display: none !important; }
      .frames-wrap { padding: 0 !important; margin: 0 !important; }
      .invoice-frame-wrap {
        box-shadow: none !important;
        margin: 0 !important;
        max-width: none !important;
        border-radius: 0 !important;
        overflow: visible !important;
        page-break-after: always !important;
        break-after: page !important;
      }
      .invoice-frame-wrap:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }
      .invoice-frame {
        min-height: 0 !important;
        overflow: visible !important;
        /* Keep explicit height from JS so browser paints iframe content */
      }
      @page {
        size: auto;
        margin: 8mm;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <span class="load-status" id="load-status">جاري تحميل {{ ids|length }} فاتورة...</span>
    <button type="button" class="btn-close" onclick="window.close()">إغلاق</button>
    <button type="button" class="btn-print" id="btn-print" onclick="window.print()">طباعة</button>
  </div>
  <div class="frames-wrap" id="frames-wrap">
    {% for oid in ids %}
    <div class="invoice-frame-wrap">
      <iframe class="invoice-frame" src="{{ url_for('orders.invoice_page', order_id=oid) }}" title="فاتورة {{ oid }}"></iframe>
    </div>
    {% endfor %}
  </div>
  <script>
    (function () {
      const frames = Array.prototype.slice.call(document.querySelectorAll('.invoice-frame'));
      const status = document.getElementById('load-status');
      const total = frames.length;
      let loaded = 0;
      let printed = false;
      const ready = new WeakSet();
      const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');

      if (!total) {
        status.textContent = 'لا توجد فواتير';
        return;
      }

      function resizeFrame(frame) {
        try {
          const doc = frame.contentDocument;
          if (!doc) return;
          const body = doc.body;
          const html = doc.documentElement;
          const height = Math.max(
            body ? body.scrollHeight : 0,
            body ? body.offsetHeight : 0,
            html ? html.scrollHeight : 0,
            html ? html.offsetHeight : 0,
            400
          );
          frame.style.height = height + 'px';

          try {
            if (doc.getElementById('finora-batch-print-fix')) return;
            const style = doc.createElement('style');
            style.id = 'finora-batch-print-fix';
            style.textContent = [
              '@media print{',
              'html,body{height:auto!important;min-height:0!important;overflow:visible!important;margin:0!important;padding:0!important;background:#fff!important;}',
              '.no-print,.invoice-actions,.actions,.toolbar{display:none!important;}',
              '.invoice,.invoice-container,.page-shell{box-shadow:none!important;margin:0!important;max-width:100%!important;width:100%!important;}',
              '@page{size:auto;margin:8mm;}',
              '}'
            ].join('');
            (doc.head || doc.documentElement).appendChild(style);
          } catch (e) {}
        } catch (e) {}
      }

      function doPrint() {
        if (printed) return;
        printed = true;
        status.textContent = 'تم التحميل — ' + total + ' فاتورة';
        frames.forEach(resizeFrame);
        setTimeout(function () {
          frames.forEach(resizeFrame);
          window.focus();
          window.print();
        }, isMobile ? 500 : 250);
      }

      function onReady(frame) {
        if (ready.has(frame)) return;
        ready.add(frame);
        loaded += 1;
        resizeFrame(frame);
        status.textContent = 'تحميل ' + loaded + ' / ' + total;
        if (loaded >= total) {
          setTimeout(doPrint, isMobile ? 600 : 350);
        }
      }

      frames.forEach(function (frame) {
        frame.addEventListener('load', function () {
          onReady(frame);
        });
        try {
          if (frame.contentDocument && frame.contentDocument.readyState === 'complete') {
            onReady(frame);
          }
        } catch (e) {}
      });

      // Safety fallback if some frames never fire load
      setTimeout(function () {
        if (!printed && loaded > 0) doPrint();
      }, 12000 + total * 800);
    })();
  </script>
</body>
</html>
