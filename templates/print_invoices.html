<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  {% include 'partials/time_format_bootstrap.html' %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طباعة الفواتير المحددة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  {{ invoice_head_assets|safe }}
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #eef2f7; }
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: #fff;
      padding: 12px 20px;
      border-bottom: 1px solid #e5e7eb;
      /* Captured invoice styles hide .no-print globally; keep the preview controls visible. */
      display: flex !important;
      gap: 10px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .toolbar button {
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
    }
    .btn-print { background: #2563eb; color: #fff; }
    .btn-close { background: #f3f4f6; color: #374151; }
    .load-status { color: #6b7280; font-size: 13px; margin-right: auto; }
    .frames-wrap { padding: 72px 16px 32px; }
    body.is-embedded .toolbar { display: none !important; }
    body.is-embedded .frames-wrap { padding: 0 !important; }
    .invoice-frame-wrap {
      max-width: 900px;
      margin: 0 auto 28px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
      page-break-after: always;
      break-after: page;
    }
    .invoice-frame-wrap:last-child {
      page-break-after: auto;
      break-after: auto;
    }
    .invoice-frame-wrap > .page-shell { margin: 0 auto !important; }
    @media print {
      html, body {
        background: #fff !important;
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
      }
      .toolbar, .no-print { display: none !important; }
      .frames-wrap { padding: 0 !important; margin: 0 !important; }
      .invoice-frame-wrap .invoice-container { padding: 8px !important; }
      .invoice-frame-wrap {
        box-shadow: none !important;
        margin: 0 !important;
        max-width: none !important;
        border-radius: 0 !important;
        overflow: hidden !important;
        page-break-after: always !important;
        break-after: page !important;
      }
      .invoice-frame-wrap:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }
      @page {
        size: auto;
        margin: 8mm;
      }
    }
  </style>
</head>
<body class="{% if request.args.get('finora_embed') == '1' %}is-embedded{% endif %}">
  <div class="toolbar no-print">
    <span class="load-status" id="load-status">جاري تحميل {{ ids|length }} فاتورة...</span>
    <button type="button" class="btn-close" onclick="window.close()">إغلاق</button>
    <button type="button" class="btn-print" id="btn-print" onclick="window.print()">طباعة</button>
  </div>
  <div class="frames-wrap" id="frames-wrap">
    {% for invoice in rendered_invoices %}
    <div class="invoice-frame-wrap">
      {{ invoice.html|safe }}
    </div>
    {% endfor %}
  </div>
  <script>
    (function () {
      const status = document.getElementById('load-status');
      const invoices = Array.prototype.slice.call(document.querySelectorAll('.invoice-frame-wrap'));
      const total = invoices.length;
      let printed = false;
      const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
      const embedded = new URLSearchParams(window.location.search).get('finora_embed') === '1';

      if (!total) {
        status.textContent = 'لا توجد فواتير';
        return;
      }

      function doPrint() {
        if (printed) return;
        printed = true;
        status.textContent = 'تم التحميل — ' + total + ' فاتورة';
        if (embedded && window.parent !== window) {
          window.parent.postMessage({ type: 'finora-batch-ready', count: total }, window.location.origin);
        } else {
          window.focus();
          window.print();
        }
      }

      async function waitForPrintAssets() {
        status.textContent = 'تجهيز ' + total + ' فاتورة...';
        const readiness = Array.prototype.slice.call(document.querySelectorAll('[data-finora-print-ready]'));
        const codesReady = await Promise.all(readiness.map(function (invoice) {
          return new Promise(function (resolve) {
            const deadline = Date.now() + 5000;
            function check() {
              if (invoice.dataset.finoraPrintReady === 'ready') return resolve(true);
              if (invoice.dataset.finoraPrintReady === 'error' || Date.now() >= deadline) return resolve(false);
              setTimeout(check, 30);
            }
            check();
          });
        }));
        if (codesReady.some(function (ready) { return !ready; })) {
          status.textContent = 'تعذر تجهيز باركود أو QR إحدى الفواتير؛ أعد المحاولة.';
          return;
        }
        try {
          if (document.fonts && document.fonts.ready) {
            await Promise.race([
              document.fonts.ready,
              new Promise(function (resolve) { setTimeout(resolve, 800); })
            ]);
          }
        } catch (e) {}

        const pendingImages = Array.prototype.slice.call(document.images)
          .filter(function (image) { return !image.complete; })
          .map(function (image) {
            return new Promise(function (resolve) {
              image.addEventListener('load', resolve, { once: true });
              image.addEventListener('error', resolve, { once: true });
            });
          });
        if (pendingImages.length) {
          await Promise.race([
            Promise.all(pendingImages),
            new Promise(function (resolve) { setTimeout(resolve, 800); })
          ]);
        }

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            setTimeout(doPrint, isMobile ? 180 : 40);
          });
        });
      }

      waitForPrintAssets();
    })();
  </script>
</body>
</html>
