<button type="button" class="landing-chat-btn" id="landingChatBtn" aria-label="فتح مساعد Finora">
    <i class="fas fa-robot"></i>
</button>
<div class="landing-chat-overlay" id="landingChatOverlay"></div>
<div class="landing-chat-panel" id="landingChatPanel">
    <div class="landing-chat-header">
        <div class="landing-chat-header-info">
            <div class="landing-chat-avatar"><i class="fas fa-robot"></i></div>
            <h3>مساعد Finora<small>متصل الآن</small></h3>
        </div>
        <button type="button" class="landing-chat-close" id="landingChatClose" aria-label="إغلاق"><i class="fas fa-times"></i></button>
    </div>
    <div class="landing-chat-messages" id="landingChatMessages">
        <div class="landing-msg assistant">مرحباً! أنا مساعد Finora الذكي. اسألني عن الميزات، الأسعار، أو أي استفسار عن المنصة وسأساعدك فوراً.</div>
    </div>
    <form class="landing-chat-form" id="landingChatForm">
        <textarea class="landing-chat-input" id="landingChatInput" placeholder="اكتب سؤالك هنا..." rows="1"></textarea>
        <button type="submit" class="landing-chat-send" id="landingChatSend"><i class="fas fa-paper-plane"></i></button>
    </form>
</div>
