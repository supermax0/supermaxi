<button type="button" class="sf-ai-fab" id="sfAiFab" aria-label="فتح مساعد المتجر">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
    <path fill="currentColor" d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7v1h-1.18A6.98 6.98 0 0 1 13 21.9V22h-2v-.1A6.98 6.98 0 0 1 5.18 15H4v-1a7 7 0 0 1 7-7h1V5.73A2 2 0 0 1 12 2zm-5 13a5 5 0 0 0 10 0H7zm2.5-9.5A1.5 1.5 0 1 0 11 5.5 1.5 1.5 0 0 0 9.5 5.5zm5 0A1.5 1.5 0 1 0 16 5.5 1.5 1.5 0 0 0 14.5 5.5z"/>
  </svg>
  <span class="sf-ai-fab-pulse" aria-hidden="true"></span>
</button>

<div class="sf-ai-overlay" id="sfAiOverlay"></div>

<div class="sf-ai-panel" id="sfAiPanel" aria-hidden="true">
  <div class="sf-ai-header">
    <div class="sf-ai-header-info">
      <div class="sf-ai-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7v1h-1.18A6.98 6.98 0 0 1 13 21.9V22h-2v-.1A6.98 6.98 0 0 1 5.18 15H4v-1a7 7 0 0 1 7-7h1V5.73A2 2 0 0 1 12 2z"/></svg>
      </div>
      <div>
        <h3 id="sfAiTitle">{{ store_design.ai_assistant_name }}</h3>
        <small>متصل الآن</small>
      </div>
    </div>
    <button type="button" class="sf-ai-close" id="sfAiClose" aria-label="إغلاق">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.71 2.88 18.3 9.17 12 2.88 5.71 4.29 4.29l6.3 6.3 6.29-6.3z"/></svg>
    </button>
  </div>

  <div class="sf-ai-messages" id="sfAiMessages"></div>

  <div class="sf-ai-track-form" id="sfAiTrackForm" hidden>
    <p>أدخل رقم الطلب ورقم الهاتف المستخدم عند الشراء:</p>
    <div class="sf-ai-track-fields">
      <input type="text" id="sfAiTrackInvoice" placeholder="رقم الطلب" inputmode="numeric">
      <input type="tel" id="sfAiTrackPhone" placeholder="07XXXXXXXXX">
    </div>
    <div class="sf-ai-track-actions">
      <button type="button" class="sf-ai-chip-btn primary" id="sfAiTrackSubmit">تتبع الآن</button>
      <button type="button" class="sf-ai-chip-btn" id="sfAiTrackCancel">إلغاء</button>
    </div>
  </div>

  <div class="sf-ai-suggestions" id="sfAiSuggestions"></div>

  <form class="sf-ai-form" id="sfAiForm">
    <textarea class="sf-ai-input" id="sfAiInput" placeholder="اكتب سؤالك هنا..." rows="1"></textarea>
    <button type="submit" class="sf-ai-send" id="sfAiSend" aria-label="إرسال">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </form>
</div>

<div class="sf-ai-video-modal" id="sfAiVideoModal" hidden>
  <div class="sf-ai-video-backdrop" id="sfAiVideoBackdrop"></div>
  <div class="sf-ai-video-dialog">
    <button type="button" class="sf-ai-video-close" id="sfAiVideoClose" aria-label="إغلاق الفيديو">×</button>
    <div class="sf-ai-video-body" id="sfAiVideoBody"></div>
  </div>
</div>
