{% extends "mobile_app/_layout.html" %}
{% block mobile_app_body %}
<div class="ma-stack">
  <div class="ma-page-head">
    <h2 class="ma-page-title">تصميم التطبيق</h2>
    <p class="ma-page-subtitle">هوية التطبيق وألوانه ووضع الصيانة</p>
  </div>

  <div class="ma-card" style="max-width:680px">
    <div class="ma-card-head">
      <div class="ma-card-icon is-purple"><i class="fas fa-palette"></i></div>
      <div>
        <h3 class="ma-card-title">الهوية والألوان</h3>
        <p class="ma-card-desc">تنعكس التغييرات على التطبيق مباشرة</p>
      </div>
    </div>
    <form method="post" class="ma-form-grid">
      <label class="ma-field">
        <span class="ma-field-label">اسم التطبيق</span>
        <input class="ma-input" name="app_name" value="{{ design.app_name }}">
      </label>

      <div class="ma-form-grid-2">
        <label class="ma-field">
          <span class="ma-field-label">Primary Dark</span>
          <div class="ma-color-field">
            <input class="ma-input" name="primary_dark" value="{{ design.primary_dark }}" oninput="this.nextElementSibling.style.background=this.value">
            <span class="ma-color-swatch" style="background:{{ design.primary_dark }}"></span>
          </div>
        </label>
        <label class="ma-field">
          <span class="ma-field-label">Surface Dark</span>
          <div class="ma-color-field">
            <input class="ma-input" name="surface_dark" value="{{ design.surface_dark }}" oninput="this.nextElementSibling.style.background=this.value">
            <span class="ma-color-swatch" style="background:{{ design.surface_dark }}"></span>
          </div>
        </label>
      </div>
      <div class="ma-form-grid-2">
        <label class="ma-field">
          <span class="ma-field-label">Soft White</span>
          <div class="ma-color-field">
            <input class="ma-input" name="soft_white" value="{{ design.soft_white }}" oninput="this.nextElementSibling.style.background=this.value">
            <span class="ma-color-swatch" style="background:{{ design.soft_white }}"></span>
          </div>
        </label>
        <label class="ma-field">
          <span class="ma-field-label">Gold Accent</span>
          <div class="ma-color-field">
            <input class="ma-input" name="gold_accent" value="{{ design.gold_accent }}" oninput="this.nextElementSibling.style.background=this.value">
            <span class="ma-color-swatch" style="background:{{ design.gold_accent }}"></span>
          </div>
        </label>
      </div>
      <label class="ma-field">
        <span class="ma-field-label">Muted Gold</span>
        <div class="ma-color-field">
          <input class="ma-input" name="muted_gold" value="{{ design.muted_gold }}" oninput="this.nextElementSibling.style.background=this.value">
          <span class="ma-color-swatch" style="background:{{ design.muted_gold }}"></span>
        </div>
      </label>

      <label class="ma-field">
        <span class="ma-field-label">رابط الشعار</span>
        <input class="ma-input" name="logo_url" value="{{ design.logo_url }}" style="direction:ltr;text-align:left" placeholder="https://...">
      </label>

      <label class="ma-check">
        <input type="checkbox" name="maintenance_mode" value="1" {% if design.maintenance_mode %}checked{% endif %}>
        <span>تفعيل وضع الصيانة (يوقف التطبيق مؤقتاً للمستخدمين)</span>
      </label>

      <label class="ma-field">
        <span class="ma-field-label">رسالة الصيانة</span>
        <textarea class="ma-input ma-textarea" name="maintenance_message" rows="2">{{ design.maintenance_message }}</textarea>
      </label>

      <div class="ma-upload-actions">
        <button class="ma-btn ma-btn-primary" type="submit"><i class="fas fa-save"></i> حفظ التصميم</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
