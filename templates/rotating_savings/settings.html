{% extends "settings_base.html" %}
{% block title %}{{ _('settings_card_rotating_savings_title') }}{% endblock %}

{% block settings_content %}
<div class="settings-page-header">
  <h1><i class="fas fa-sync-alt"></i> {{ _('settings_card_rotating_savings_title') }}</h1>
  <p>{{ _('settings_card_rotating_savings_desc') }}</p>
</div>

<div class="settings-section-card">
  <form class="settings-grid" method="post" style="gap:16px;">
    <div class="settings-switch-row">
      <div class="settings-switch-label"><strong>{{ _('rs_settings_enable') }}</strong></div>
      <label class="settings-toggle"><input type="checkbox" name="enabled" value="1" {% if settings.enabled %}checked{% endif %}><span class="settings-toggle-slider"></span></label>
    </div>
    <div class="settings-field">
      <label class="settings-field-label">{{ _('rs_settings_owner_return') }}</label>
      <select name="owner_return_mode" class="settings-select">
        <option value="drawings" {% if settings.owner_return_mode == 'drawings' %}selected{% endif %}>{{ _('rs_settings_owner_drawings') }}</option>
        <option value="owner_current" {% if settings.owner_return_mode == 'owner_current' %}selected{% endif %}>{{ _('rs_settings_owner_current') }}</option>
      </select>
    </div>
    <div class="settings-field">
      <label class="settings-field-label">{{ _('rs_settings_cash_flow') }}</label>
      <select name="cash_flow_classification" class="settings-select">
        <option value="operating" {% if settings.cash_flow_classification == 'operating' %}selected{% endif %}>{{ _('rs_settings_operating') }}</option>
        <option value="investing" {% if settings.cash_flow_classification == 'investing' %}selected{% endif %}>{{ _('rs_settings_investing') }}</option>
        <option value="financing" {% if settings.cash_flow_classification == 'financing' %}selected{% endif %}>{{ _('rs_settings_financing') }}</option>
      </select>
    </div>
    <div class="settings-actions-bar" style="grid-column:1/-1;margin-top:8px;">
      <button type="submit" class="settings-btn settings-btn-primary"><i class="fas fa-save"></i> {{ _('settings_save') }}</button>
    </div>
  </form>
</div>
{% endblock %}
