<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script src="/static/js/no-zoom.js"></script>
    <title>تسجيل دخول سوبر أدمن — Finora</title>
    <link rel="icon" type="image/png" href="{{ platform_logo_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/superadmin.css') }}">
    <style>
        body.sa-login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.08), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.06), transparent 35%),
                var(--bg-main);
        }
        .sa-login-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: var(--shadow-hover);
            padding: 36px 32px;
        }
        .sa-login-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), #4F46E5);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 20px;
        }
        .sa-login-card h1 {
            margin: 0 0 6px;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
        }
        .sa-login-card p {
            margin: 0 0 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }
        .sa-login-field { margin-bottom: 16px; }
        .sa-login-field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .sa-login-field input {
            width: 100%;
            min-height: 46px;
            padding: 0 14px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
        }
        .sa-login-field input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        .sa-login-submit {
            width: 100%;
            min-height: 48px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            font-weight: 800;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .sa-login-submit:hover { background: var(--primary-hover); }
        .sa-login-error {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body class="sa-body sa-login">
    <div class="sa-login-card">
        <div class="sa-login-icon"><i class="fas fa-user-shield"></i></div>
        <h1>Finora Superadmin</h1>
        <p>سجّل الدخول للوصول إلى مركز التحكم المركزي</p>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="sa-login-error"><i class="fas fa-exclamation-circle"></i> {{ messages[0] }}</div>
        {% endif %}
        {% endwith %}

        <form method="post">
            <div class="sa-login-field">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" name="username" required autocomplete="username" value="supermax">
            </div>
            <div class="sa-login-field">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="sa-login-submit">
                <span>دخول آمن</span>
                <i class="fas fa-arrow-left"></i>
            </button>
        </form>
    </div>
</body>
</html>
