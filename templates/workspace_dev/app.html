<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script src="/static/js/no-zoom.js"></script>
  <title>Finora AI Workspace — DEV</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='workspace/css/workspace.css') }}">
  <style>
    .ws-dev-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: linear-gradient(90deg, #7c3aed, #6366f1);
      color: #fff;
      text-align: center;
      font-size: 12px;
      padding: 4px;
      font-weight: 600;
    }
    .ws-root { padding-top: 24px; }
  </style>
</head>
<body class="ws-body">
  <div class="ws-dev-banner">وضع التطوير — workspace_dev (?dev=1)</div>
  <div id="workspace-root" class="ws-root">
    <header class="ws-toolbar">
      <div class="ws-toolbar-start">
        <span class="ws-logo">◆</span>
        <h1 class="ws-title">Finora AI Workspace <small style="opacity:.7">DEV</small></h1>
        <span id="ws-status-pill" class="ws-status-pill ws-status-idle">جاهز</span>
      </div>
      <div class="ws-toolbar-actions">
        <button type="button" id="btn-upload" class="ws-btn ws-btn-upload">رفع مستند</button>
        <button type="button" id="btn-intelligence" class="ws-btn ws-btn-primary" disabled>فهم المستند</button>
        <button type="button" id="btn-courier-analysis" class="ws-btn ws-btn-ghost" disabled>تحليل كشف التسديد قراءة فقط</button>
        <button type="button" id="btn-workflow" class="ws-btn ws-btn-primary">تشغيل Workflow</button>
        <button type="button" id="btn-select-workflow" class="ws-btn ws-btn-ghost">اختيار نوع العمل</button>
        <button type="button" id="btn-next-step" class="ws-btn ws-btn-ghost">الخطوة التالية</button>
        <button type="button" id="btn-new-session" class="ws-btn ws-btn-ghost">جلسة جديدة</button>
        <button type="button" id="btn-run-mock" class="ws-btn ws-btn-ghost">تشغيل تجربة</button>
        <button type="button" id="btn-cancel" class="ws-btn ws-btn-danger">إلغاء</button>
      </div>
    </header>

    <main id="ws-canvas" class="ws-canvas" aria-label="مساحة العمل">
      <div id="ws-windows-layer" class="ws-windows-layer"></div>
      <div id="ws-avatar-layer" class="ws-avatar-layer"></div>

      <div class="ws-chatbar">
        <div class="ws-chatbar-inner">
          <span class="ico">&#9000;</span>
          <input id="ws-chat-input" class="ws-chat-input" type="text" placeholder="اسأل LEON أو أعطه أمراً..." autocomplete="off" />
          <button type="button" id="ws-chat-send" class="ws-chat-send" title="إرسال">&#127908;</button>
        </div>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='workspace/js/session-store.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/event-stream.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/workspace-canvas.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/windows/live-report-window.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/windows/document-viewer-window.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/windows/assistant-notes-window.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/windows/approval-panel-window.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/windows/workflow-selector-window.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/windows/session-timeline-window.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/windows/document-intelligence-window.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/windows/raw-table-preview-window.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/workspace-layout-director.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/window-manager.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/session-timeline.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/workflow-client.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/document-intelligence-client.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/courier-analysis-client.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/windows/courier-settlement-analysis-window.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/windows/courier-rows-window.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/windows/courier-issues-window.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/windows/financial-preview-window.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/leon-avatar.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/progress-panel.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/upload-manager.js') }}"></script>
  <script src="{{ url_for('static', filename='workspace/js/workspace-app.js') }}"></script>
</body>
</html>
